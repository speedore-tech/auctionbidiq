services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bidiq
      POSTGRES_USER: bidiq
      POSTGRES_PASSWORD: ${BIDIQ_DB_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
    depends_on: [db]
    environment:
      BIDIQ_DATABASE_URL: postgresql+psycopg://bidiq:${BIDIQ_DB_PASSWORD:-change-me}@db:5432/bidiq
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
volumes:
  pgdata: {}
  uploads: {}
